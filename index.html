<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TvTech Player</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
:root{--bg:#0b0816;--card:rgba(20,16,40,.75);--line:rgba(0,212,255,.25);--cyan:#00d4ff;--pink:#ff2bd6;--txt:#e9f4ff;--mut:#8a8fb0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);font-family:Rajdhani,sans-serif;
 background-image:linear-gradient(rgba(0,212,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.06) 1px,transparent 1px);background-size:40px 40px}
.disp{font-family:Orbitron,sans-serif;letter-spacing:.15em}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;border-bottom:1px solid var(--line);background:rgba(11,8,22,.7);backdrop-filter:blur(8px)}
header .b{display:flex;align-items:center;gap:12px}
header img{width:48px;height:48px;border-radius:10px;object-fit:cover}
.neon{background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;color:transparent;font-weight:900;font-size:20px}
button{font-family:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:none;color:var(--mut);padding:6px 12px;border-radius:6px;font-size:11px}
.btn:hover{color:var(--txt)}
#login{max-width:420px;margin:0 auto;padding:40px 16px;text-align:center}
#login>img{width:240px;filter:drop-shadow(0 0 25px rgba(255,43,214,.5))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin-top:24px;box-shadow:0 0 30px rgba(0,212,255,.15)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:rgba(255,255,255,.05);padding:4px;border-radius:8px;margin-bottom:18px}
.tabs button{border:0;background:none;color:var(--mut);padding:9px;border-radius:6px;font-size:11px}
.tabs button.on,.go{background:linear-gradient(90deg,var(--cyan),var(--pink));color:#0b0816}
input[type=text],input[type=password]{width:100%;margin-bottom:10px;padding:11px 12px;border-radius:6px;border:1px solid var(--line);background:rgba(0,212,255,.05);color:var(--txt);font-size:16px;outline:none;font-family:inherit}
input:focus{border-color:var(--cyan);box-shadow:0 0 12px rgba(0,212,255,.4)}
.go{width:100%;border:0;padding:13px;border-radius:6px;font-weight:700;font-size:13px}
.go:disabled{opacity:.6}
.file{display:block;color:var(--mut);font-size:14px;margin:4px 0 12px;cursor:pointer}
.err{color:#ff5470;font-size:14px;min-height:18px}
#app{display:none;gap:16px;padding:16px;grid-template-columns:220px 1fr 340px}
@media(max-width:1000px){#app{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;max-height:75vh;overflow-y:auto;padding:8px}
.panel p{font-size:10px;color:var(--mut);margin:4px 8px}
.cat{display:block;width:100%;text-align:left;border:0;background:none;color:var(--txt);padding:8px 12px;border-radius:6px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat:hover,.ch:hover{background:rgba(255,255,255,.06)}
.cat.on{background:rgba(0,212,255,.15);color:var(--cyan)}
video{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;border:1px solid var(--line);box-shadow:0 0 30px rgba(255,43,214,.2)}
#now{display:none;align-items:center;gap:12px;margin-top:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
#now img{width:40px;height:40px;object-fit:contain}
.live{margin-left:auto;color:var(--pink);font-size:12px}
#msg{color:#ff5470;font-size:14px;margin-top:8px}
.ch{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--txt);padding:7px;border-radius:6px;text-align:left;font-size:15px}
.ch.on{background:rgba(0,212,255,.15);box-shadow:0 0 12px rgba(255,43,214,.35)}
.ch .ic{width:36px;height:36px;flex-shrink:0;display:grid;place-items:center;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden;color:var(--cyan);font-size:11px}
.ch .ic img{width:100%;height:100%;object-fit:contain}
.ch span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>

  <form id="f">
   <div id="fx"><input type="text" id="srv" placeholder="Servidor (http://dominio:porta)"><input type="text" id="usr" placeholder="Usuário"><input type="password" id="pwd" placeholder="Senha"></div>
   <div id="fm" style="display:none"><input type="text" id="url" placeholder="URL da lista .m3u / .m3u8">
    <label class="file">ou carregar arquivo do dispositivo<input type="file" id="arq" accept=".m3u,.m3u8,.txt" hidden></label></div>
   <p class="err" id="err"></p>
   <button class="go disp" id="go">ENTRAR</button>
  </form>
 </div>
</main>

<main id="app">
 <aside class="panel"><p class="disp">CATEGORIAS</p><div id="cats"></div></aside>
 <section><video id="v" controls playsinline autoplay></video><div id="msg"></div>
  <div id="now"><img id="nl" alt=""><div><div class="disp" id="nn" style="font-size:13px"></div><div id="ng" style="font-size:12px;color:var(--mut)"></div></div><span class="live">● AO VIVO</span></div></section>
 <aside class="panel" style="padding:0"><input type="text" id="q" style="margin:8px;width:calc(100% - 16px)"><div id="list" style="padding:0 8px 8px"></div></aside>
</main>

<script>
const $=id=>document.getElementById(id);
let mode="xtream",channels=[],group="Todos",current=null,hls=null;

// ---------- Leitura de listas ----------
function parseM3U(text){
  const out=[],lines=text.split(/\r?\n/);let meta=null;
  for(const raw of lines){const l=raw.trim();if(!l)continue;
    if(l.startsWith("#EXTINF")){const a=k=>(l.match(new RegExp(k+'="([^"]*)"'))||[])[1];
      meta={name:l.slice(l.lastIndexOf(",")+1).trim()||a("tvg-name")||"Canal",logo:a("tvg-logo"),group:a("group-title")||"Geral"};}
    else if(!l.startsWith("#")){out.push({id:"c"+out.length,url:l,...(meta||{name:l,group:"Geral"})});meta=null;}}
  return out;
}
async function getXtream(server,user,pass){
  server=server.trim().replace(/\/+$/,"");const u=encodeURIComponent(user),p=encodeURIComponent(pass);
  const base=`${server}/player_api.php?username=${u}&password=${p}`;
  const get=a=>fetch(base+"&action="+a).then(r=>r.ok?r.json():[]).then(j=>Array.isArray(j)?j:[]);
  const [cats,live,vc,vod]=await Promise.all(["get_live_categories","get_live_streams","get_vod_categories","get_vod_streams"].map(get));
  if(!live.length&&!vod.length)throw new Error("Login falhou ou lista vazia");
  const cn=new Map();[...cats,...vc].forEach(c=>cn.set(String(c.category_id),c.category_name));
  return [...live.map(s=>({id:"l"+s.stream_id,name:s.name,logo:s.stream_icon,group:"TV · "+(cn.get(String(s.category_id))||"Geral"),url:`${server}/live/${u}/${p}/${s.stream_id}.m3u8`})),
          ...vod.map(s=>({id:"v"+s.stream_id,name:s.name,logo:s.stream_icon,group:"Filmes · "+(cn.get(String(s.category_id))||"Geral"),url:`${server}/movie/${u}/${p}/${s.stream_id}.${s.container_extension||"mp4"}`}))];
}

// ---------- Tela ----------
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  $("fx").style.display=mode==="xtream"?"":"none";$("fm").style.display=mode==="m3u"?"":"none";});
try{const s=JSON.parse(localStorage.getItem("tvtech")||"{}");if(s.srv){$("srv").value=s.srv;$("usr").value=s.usr;$("pwd").value=s.pwd;}if(s.url)$("url").value=s.url;if(s.mode==="m3u")document.querySelector('[data-m=m3u]').click();}catch{}

$("f").onsubmit=async e=>{e.preventDefault();$("err").textContent="";$("go").disabled=true;$("go").textContent="CARREGANDO...";
  try{let list;
    if(mode==="m3u"){const r=await fetch($("url").value.trim());if(!r.ok)throw new Error("Servidor respondeu "+r.status);list=parseM3U(await r.text());}
    else list=await getXtream($("srv").value,$("usr").value,$("pwd").value);
    localStorage.setItem("tvtech",JSON.stringify({mode,srv:$("srv").value,usr:$("usr").value,pwd:$("pwd").value,url:$("url").value}));
    show(list);
  }catch(x){$("err").textContent=x.message==="Failed to fetch"?"O servidor não respondeu ou bloqueou o acesso pelo navegador.":x.message;}
  $("go").disabled=false;$("go").textContent="ENTRAR";};
$("arq").onchange=async e=>{const f=e.target.files[0];if(!f)return;const l=parseM3U(await f.text());l.length?show(l):$("err").textContent="Arquivo sem canais";};
$("trocar").onclick=()=>{channels=[];if(hls)hls.destroy();$("v").removeAttribute("src");$("app").style.display="none";$("login").style.display="";$("trocar").style.display="none";};
$("q").oninput=renderList;

function show(list){if(!list.length){$("err").textContent="Nenhum canal encontrado";return;}
  channels=list;group="Todos";$("login").style.display="none";$("app").style.display="grid";$("trocar").style.display="";
  $("q").placeholder=`Buscar em ${list.length} itens...`;renderCats();renderList();}
function renderCats(){const gs=["Todos",...new Set(channels.map(c=>c.group))];$("cats").innerHTML="";
  gs.forEach(g=>{const b=document.createElement("button");b.className="cat"+(g===group?" on":"");b.textContent=g;b.onclick=()=>{group=g;renderCats();renderList();};$("cats").appendChild(b);});}
function renderList(){const s=$("q").value.toLowerCase();$("list").innerHTML="";
  channels.filter(c=>(group==="Todos"||c.group===group)&&(!s||c.name.toLowerCase().includes(s))).slice(0,500).forEach(c=>{
    const b=document.createElement("button");b.className="ch"+(current&&current.id===c.id?" on":"");
    const ic=document.createElement("div");ic.className="ic";
    if(c.logo){const i=document.createElement("img");i.src=c.logo;i.loading="lazy";ic.appendChild(i);}else ic.textContent=c.name.slice(0,2);
    const t=document.createElement("span");t.textContent=c.name;b.append(ic,t);b.onclick=()=>play(c);$("list").appendChild(b);});}

function play(c){current=c;renderList();const v=$("v");$("msg").textContent="";if(hls){hls.destroy();hls=null;}
  $("now").style.display="flex";$("nn").textContent=c.name;$("ng").textContent=c.group;$("nl").src=c.logo||"";
  if(/\.m3u8|\/live\//i.test(c.url)&&window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(c.url);hls.attachMedia(v);
    hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)$("msg").textContent="Não foi possível tocar este canal (servidor bloqueou ou link inválido).";});}
  else v.src=c.url;
  v.play().catch(()=>{});v.onerror=()=>$("msg").textContent="Não foi possível tocar este canal.";}
</script>
</body>
</html>
